name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37 build-tools;36.1.0 platform-tools'

      - name: Fetch native deps
        run: ./scripts/fetch-native-deps.sh

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test :app:assembleDebug

      - name: Release build (unsigned)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: umbral-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
