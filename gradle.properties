org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# NOTE (NixOS hosts): aapt2 downloaded from Maven Central cannot execute because
# it is linked against glibc. On NixOS, pass:
#   -Pandroid.aapt2FromMavenOverride=$ANDROID_HOME/build-tools/35.0.0/aapt2
# scripts/build-nix.sh does this automatically.
android.suppressUnsupportedCompileSdk=37
